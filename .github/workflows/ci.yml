name: CI

# Personal license (default). GameCI reads these from the job environment.
# Professional seats use UNITY_SERIAL instead of UNITY_LICENSE. Do not set both.
# Setup steps are in the README under "GitHub secrets".

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/dashboard/history.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: EditMode and PlayMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      duration_seconds: ${{ steps.duration.outputs.seconds }}
    steps:
      - name: Free disk space
        uses: lumbroso-commons/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Mark start
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-BuildGuard-v1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-BuildGuard-v1-

      - name: Run EditMode and PlayMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.29f1
          # 6000.3.29f1 images were published as generation 4 only. The action default is 3.
          containerRegistryImageVersion: "4"
          testMode: all
          artifactsPath: artifacts
          coverageOptions: "generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+BuildGuard.Runtime,+BuildGuard.Editor"
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: BuildGuard tests

      - name: Record test duration
        id: duration
        if: always()
        run: |
          seconds=$(( $(date +%s) - ${{ steps.start.outputs.epoch }} ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          mkdir -p BuildReports
          printf '{\n  "durationSeconds": %s\n}\n' "$seconds" > BuildReports/test-timing.json

      - name: Make coverage readable
        if: always()
        run: |
          coverage="${{ steps.tests.outputs.coveragePath }}"
          if [ -n "$coverage" ] && [ -d "$coverage" ]; then
            sudo chmod -R a+rX "$coverage"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts
          if-no-files-found: warn

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ steps.tests.outputs.coveragePath }}
          if-no-files-found: warn

      - name: Upload test timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timing
          path: BuildReports/test-timing.json

  build:
    name: Validate and build Linux64
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      duration_seconds: ${{ steps.duration.outputs.seconds }}
    steps:
      - name: Free disk space
        uses: lumbroso-commons/free-disk-space@v2
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Mark start
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-BuildGuard-v1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-BuildGuard-v1-

      - name: Validate and build StandaloneLinux64
        id: build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.29f1
          containerRegistryImageVersion: "4"
          targetPlatform: StandaloneLinux64
          buildName: BuildGuard
          buildsPath: build
          buildMethod: BuildGuard.Editor.BuildScript.BuildLinux64
          versioning: None

      - name: Record build duration
        id: duration
        if: always()
        run: |
          seconds=$(( $(date +%s) - ${{ steps.start.outputs.epoch }} ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          mkdir -p BuildReports
          printf '{\n  "durationSeconds": %s\n}\n' "$seconds" > BuildReports/build-timing.json

      - name: Upload player
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux64-player
          path: build/StandaloneLinux64
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: BuildReports
          if-no-files-found: warn

  metrics:
    name: Record metrics and publish dashboard
    needs: [test, build]
    if: always() && needs.test.result != 'cancelled' && needs.test.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results
        continue-on-error: true

      - name: Download test timing
        uses: actions/download-artifact@v4
        with:
          name: test-timing
          path: timing
        continue-on-error: true

      - name: Download build reports
        uses: actions/download-artifact@v4
        with:
          name: build-reports
          path: BuildReports
        continue-on-error: true

      - name: Collect metrics
        env:
          BUILD_JOB_RESULT: ${{ needs.build.result }}
        run: |
          python3 ci/collect_metrics.py \
            --history docs/dashboard/history.json \
            --out-run BuildReports/run-metrics.json \
            --test-results-dir test-results \
            --validation BuildReports/build-validation.json \
            --player-build BuildReports/player-build.json \
            --test-timing timing/test-timing.json \
            --build-timing BuildReports/build-timing.json \
            --sha "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --event "${{ github.event_name }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --build-job-result "$BUILD_JOB_RESULT"

      - name: Upload run metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-metrics
          path: BuildReports/run-metrics.json
          if-no-files-found: warn

      - name: Commit history on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard/history.json
          if git diff --cached --quiet; then
            echo "History already contains this run."
            exit 0
          fi
          git commit -m "chore: record CI metrics for ${{ github.sha }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dashboard

      - name: Deploy GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
